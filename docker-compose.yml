version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgis/postgis:16-3.4
    container_name: layouts_postgres
    restart: always
    environment:
      POSTGRES_DB: layouts_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layouts_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 Caching & Async Task Infrastructure
  # ---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: layouts_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ---------------------------------------------------------------------------
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: layouts_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_secure_password@postgres_db:5432/layouts_ai
      REDIS_URL: redis://redis_cache:6379/0
      JWT_SECRET_KEY: dev_super_secret_jwt_key_32bytes_min
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

volumes:
  postgres_data:
