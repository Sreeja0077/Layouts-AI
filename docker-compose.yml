version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database & pgvector
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgis/postgis:16-3.4
    container_name: layouts_postgres
    restart: always
    environment:
      POSTGRES_DB: layouts_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layouts_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 Caching & Celery Task Queue
  # ---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: layouts_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage
  # ---------------------------------------------------------------------------
  minio_storage:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: layouts_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ---------------------------------------------------------------------------
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: layouts_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres_db:5432/layouts_ai
      STORAGE_ENDPOINT_URL: http://minio_storage:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
      REDIS_URL: redis://redis_cache:6379/0
      JWT_SECRET_KEY: dev_super_secret_jwt_key_32bytes_min
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
