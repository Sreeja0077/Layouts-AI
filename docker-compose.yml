version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgis/postgis:16-3.4
    container_name: layouts_postgres
    restart: always
    environment:
      POSTGRES_DB: layouts_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layouts_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 Caching & Async Task Infrastructure
  # ---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: layouts_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ---------------------------------------------------------------------------
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: layouts_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_secure_password@postgres_db:5432/layouts_ai
      REDIS_URL: redis://redis_cache:6379/0
      JWT_SECRET_KEY: dev_super_secret_jwt_key_32bytes_min
      # OMA Cloud AI Gateway
      OMA_API_KEY: ${OMA_API_KEY:-}
      OMA_BASE_URL: ${OMA_BASE_URL:-https://oma.novelinfra.com}
      OMA_MODEL_DEFAULT: ${OMA_MODEL_DEFAULT:-glm-5.1-cloud}
      OMA_MODEL_SPEC: ${OMA_MODEL_SPEC:-glm-5.2-cloud}
      OMA_MODEL_LAYOUT: ${OMA_MODEL_LAYOUT:-glm-5.2-cloud}
      OMA_MODEL_CHANGE: ${OMA_MODEL_CHANGE:-glm-5.2-cloud}
      OMA_MODEL_EXPLAIN: ${OMA_MODEL_EXPLAIN:-glm-5.1-cloud}
      OMA_MODEL_OCR: ${OMA_MODEL_OCR:-glm-ocr-latest}
      OMA_MODEL_VISION: ${OMA_MODEL_VISION:-glm-5.1-cloud}
      OMA_MODEL_CODE: ${OMA_MODEL_CODE:-kimi-k2.7-code-cloud}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-memory}
      # Local Ollama / Alternate Cloud Fallbacks
      LITELLM_MODEL_FAST: ${LITELLM_MODEL_FAST:-}
      LITELLM_MODEL_REASONING: ${LITELLM_MODEL_REASONING:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

volumes:
  postgres_data:
