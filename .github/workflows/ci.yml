name: CI/CD Pipeline - Layouts AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Unit Tests & Database Foundation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_secure_password@localhost:5432/layouts_ai

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: layouts_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Domain Schemas Unit Test
        run: |
          python backend/tests/unit/test_domain_schemas.py

      - name: Run Database ORM Metadata Unit Test
        run: |
          python backend/tests/unit/test_db_schema.py

      - name: Run FastAPI Main API Unit Test
        run: |
          python backend/tests/unit/test_main_api.py

      - name: Run Security & RBAC Unit Test
        run: |
          python backend/tests/unit/test_security_rbac.py

      - name: Run Database Connection Unit Test
        run: |
          python backend/tests/unit/test_database_connection.py

      - name: Run PostgreSQL Integration Unit Test
        run: |
          python backend/tests/integration/test_postgres_integration.py

      - name: Run Real PostgreSQL Alembic Migrations
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Verify Live PostgreSQL Extensions, 13 Tables & Indexes
        run: |
          python backend/tests/integration/verify_postgres_schema.py

      - name: Run FreeSpace Unit Test
        run: |
          python backend/tests/unit/test_freespace.py

      - name: Run Layout Validation Rules Engine Unit Test
        run: |
          python backend/tests/unit/test_rules_engine.py

      - name: Run Revit IFC Floor-Plan Ingestion Unit & Integration Test
        run: |
          python backend/tests/unit/test_ifc_ingest.py
          pytest backend/tests/unit/test_ifc_ingest.py -v

      - name: Run 2D AutoCAD DXF CAD Ingestion Unit & Integration Test
        run: |
          python backend/tests/unit/test_dxf_ingest.py
          pytest backend/tests/unit/test_dxf_ingest.py -v

      - name: Run Geometry Reconciliation Unit & Integration Test
        run: |
          python backend/tests/unit/test_reconciliation.py
          pytest backend/tests/unit/test_reconciliation.py -v

      - name: Run Floor Plan Verification API Integration Test
        run: |
          python backend/tests/integration/test_verification_api.py
          pytest backend/tests/integration/test_verification_api.py -v

